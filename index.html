function now(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}function removeProduct(i){const snapshot=JSON.parse(JSON.stringify(data[i]));snapshot.state='已移出';snapshot.changed=now();snapshot.currentMetrics=null;data[i]=snapshot;closeDialog();render();toast('已归档并保存当时数据')}

function addProduct(){let sku=$('newSku').value.trim(),warehouse=$('newWarehouse').value;if(!warehouse||!sku){alert('请选择仓库并填写产品编码');return}if(data.some(x=>x.sku.toLowerCase()===sku.toLowerCase()&&x.warehouse===warehouse&&x.state==='当前')){alert('该仓库的产品已在当前名单中');return}let t=now();data.unshift({warehouse,sku,name:'—',problem:'—',complaints:null,refund:'—',rate:null,month:null,week:null,source:'手动添加',creator:'管理员',entered:t,state:'当前',changed:t,check:'—',inspector:'—',qty:'—',hot:false,risk:false});tab='当前';document.querySelectorAll('[data-tab]').forEach(v=>v.classList.toggle('active',v.dataset.tab===tab));['keyword','source'].forEach(i=>$(i).value='');$('warehouse').value=warehouse;closeDialog();render();toast('添加成功')}
$('rules').onclick=()=>openDialog('判定规则设置',`<p style="margin:0 0 16px;color:#8b9aa6;font-size:12px;line-height:1.7">满足爆款条件的产品自动进入列表；满足高风险条件的爆款额外标记为高风险。</p><div style="border:1px solid #dbe6eb;border-radius:3px;padding:5px 14px 12px;margin-bottom:12px"><div class="section-title">第一层：爆款判定</div><div style="display:flex;align-items:center;flex-wrap:wrap"><div class="field"><label>近 30 天销量</label><span>＞</span><input type="number" id="tm" min="0" value="${threshold.month}" style="width:100px"><span>件</span></div><span>，且</span><div class="field"><label style="width:auto">近 7 天销量</label><span>＞</span><input type="number" id="tw" min="0" value="${threshold.week}" style="width:100px"><span>件</span></div></div></div><div style="border:1px solid #f1d8cc;border-radius:3px;padding:5px 14px 12px;background:#fffcfa"><div class="section-title" style="border-color:#e89a6e">第二层：高风险爆款判定</div><div style="display:flex;align-items:center;flex-wrap:wrap"><div class="field"><label>近 30 天客诉次数</label><span>≥</span><input type="number" id="tc" min="0" value="${threshold.complaints}" style="width:100px"><span>次</span></div><span>，且</span><div class="field"><label style="width:auto">质量退货率</label><span>≥</span><input type="number" id="tr" min="0" step="0.1" value="${threshold.rate}" style="width:100px"><span>%</span></div></div></div>`,`<button class="btn" onclick="closeDialog()">取消</button><button class="btn primary" onclick="saveRules()">保存</button>`);function saveRules(){let vals=['tm','tw','tc','tr'].map(i=>$(i).value);if(vals.some(v=>v===''||+v<0)||+vals[3]>100){alert('请输入有效阈值，退货率范围为 0–100');return}threshold={month:+vals[0],week:+vals[1],complaints:+vals[2],rate:+vals[3]};closeDialog();toast('规则已保存')}render();
</script><script>

 if(tab==='当前'){$('riskFilter').style.display='';headRow.innerHTML=currentHead;originalRender();headRow.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{if(sortKey===b.dataset.sort)sortDirection*=-1;else{sortKey=b.dataset.sort;sortDirection=1}render()});return}

};
function showComplaints(i){const x=data[i],n=x.complaints??0,types=['缺少配件','发错货','链接与实物不符','少发/漏发'],counts=types.map((_,j)=>Math.floor(n/4)+(j<n%4?1:0));openDialog('近30天客诉 · '+x.sku,`<table class="detail-table"><thead><tr><th>问题类型</th><th>次数</th></tr></thead><tbody>${types.map((type,j)=>`<tr><td>${type}</td><td>${counts[j]}</td></tr>`).join('')}</tbody></table>`,`<button class="btn" onclick="closeDialog()">关闭</button>`)}

compare=function(i,mode='current'){
 const x=data[i],next=data.filter(r=>r.state==='已移出'&&r.warehouse===x.warehouse&&r.sku===x.sku&&r.changed>x.changed).sort((a,b)=>a.changed.localeCompare(b.changed))[0],c=mode==='next'?next:x.currentMetrics;
 const stamp=c?(mode==='next'?c.changed:c.updated):'',fmt=(v,p)=>v==null?'—':p?v.toFixed(2)+'%':String(v),fields=[['近30天客诉','complaints',false],['质量退款率','rate',true],['近30天销量','month',false],['近7天销量','week',false]];
